<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>TokenGo — 把探索变成收藏</title>
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="titlebar"></div>
    <aside class="sidebar">
      <a class="brand" href="#collection" aria-label="TokenGo 首页"
        ><span class="brand-mark">✦</span
        ><span>Token<span class="brand-go">Go</span><small>每一步，都算数。</small></span></a
      >
      <div class="nav-caption">你的冒险</div>
      <nav aria-label="主要导航">
        <button data-view="collection" class="nav-item active">
          <span>◇</span> 成就图鉴 <b id="nav-total">1,224</b></button
        ><button data-view="hidden" class="nav-item">
          <span>✧</span> 秘密档案 <i class="tiny-dot"></i></button
        ><button data-view="cabinet" class="nav-item"><span>▦</span> 我的展柜</button
        ><button data-view="activity" class="nav-item"><span>◷</span> 解锁足迹</button>
      </nav>
      <div class="nav-caption second">无限可能</div>
      <nav aria-label="更多">
        <button data-view="community" class="nav-item"><span>⌘</span> 社区共创</button
        ><button data-view="settings" class="nav-item"><span>⚙</span> 偏好设置</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-seal">
          <span class="status-dot"></span>
          <div>你的数据，只属于你<small>本地记录 · 无遥测 · 开源</small></div>
        </div>
        <div class="profile">
          <div class="avatar">T</div>
          <div>本地探险家<small id="profile-mode">准备开始旅程</small></div>
          <span class="profile-dots">···</span>
        </div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumb">
          个人空间 <span>/</span> <strong id="view-label">成就图鉴</strong>
        </div>
        <div class="top-actions">
          <span id="mode-indicator" class="mode"><i class="status-dot"></i> 离线就绪</span
          ><button
            class="icon-button"
            id="preview-toast"
            title="预览成就弹卡"
            aria-label="预览成就弹卡"
          >
            ♧
          </button>
        </div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <div id="content"></div>
      <footer>
        <span>TokenGo <span class="muted">/</span> 为每个好奇心，留一枚徽章。</span
        ><span>本地优先 <span class="footer-star">✦</span> 社区驱动</span>
      </footer>
    </main>
    <dialog id="detail-dialog" aria-label="成就详情">
      <button class="dialog-close" data-close aria-label="关闭">×</button>
      <div id="detail-body"></div>
    </dialog>
    <dialog id="share-dialog" aria-label="分享成就">
      <button class="dialog-close" data-close aria-label="关闭">×</button>
      <h2>这一刻，值得分享。</h2>
      <p class="muted">图片在本机生成。只有你点击发布入口，才会打开外部平台。</p>
      <canvas id="share-canvas" width="1200" height="675"></canvas
      ><label class="field-label" for="share-text">分享文案 · 可编辑</label
      ><textarea id="share-text" rows="3" maxlength="2000"></textarea>
      <div class="share-actions">
        <button class="button secondary" id="copy-image">复制图片</button
        ><button class="button secondary" id="save-image">保存 PNG</button
        ><button class="button secondary" id="copy-text">复制文案</button
        ><button class="button" id="share-x">分享到 X ↗</button
        ><button class="button reddit" id="share-reddit">Reddit ↗</button>
      </div>
      <p class="share-note">
        图片需在平台中粘贴或上传；不会自动发布。卡片不包含对话、代码或文件路径。
      </p>
    </dialog>
    <div id="snackbar" role="status" aria-live="polite"></div>
    <div id="web-toast" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
