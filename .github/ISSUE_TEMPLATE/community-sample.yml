name: Contribute to the community sample
description: Share an optional, locally generated achievement-only report.
title: '[Community sample] Achievement report'
body:
  - type: markdown
    attributes:
      value: |
        This is voluntary and public. GitHub shows your account on this issue.
        The report itself contains only a random installation ID and achievement IDs/medal levels.
        Do not include prompts, logs, paths, token counts or personal information.
        This is a self-reported community sample, not a verified global population.
  - type: checkboxes
    attributes:
      label: Consent
      options:
        - label: I understand that this report and my GitHub account are public, and I choose to contribute.
          required: true
  - type: textarea
    attributes:
      label: Anonymous payload
      description: Paste the report generated by TokenGo. Do not edit its structure.
      render: json
    validations:
      required: true
